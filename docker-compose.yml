# Local development services. Only two are stateful (ADR-0006): Postgres and object storage.
# Mailpit catches outgoing mail so nothing leaves the machine.

name: teamflow

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: teamflow
      POSTGRES_PASSWORD: teamflow
      POSTGRES_DB: teamflow
    ports:
      - "${POSTGRES_PORT:-5442}:5432"
    volumes:
      - postgres:/var/lib/postgresql
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teamflow -d teamflow"]
      interval: 2s
      timeout: 3s
      retries: 30

  storage:
    # RustFS: an S3-compatible object store. Any S3 API works in production.
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: teamflow
      RUSTFS_SECRET_KEY: teamflow-secret
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "${STORAGE_PORT:-9100}:9000"
      - "${STORAGE_CONSOLE_PORT:-9101}:9001"
    volumes:
      - storage:/data

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_SMTP_PORT:-1035}:1025"
      - "${MAILPIT_UI_PORT:-8035}:8025"

volumes:
  postgres:
  storage:
